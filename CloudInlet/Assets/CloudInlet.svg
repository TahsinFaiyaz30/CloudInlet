<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="CloudInlet app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20385b"/>
      <stop offset="0.48" stop-color="#132942"/>
      <stop offset="1" stop-color="#0b1c35"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#60dcf4"/>
      <stop offset="0.5" stop-color="#188fbf"/>
      <stop offset="1" stop-color="#176298"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#35bce7"/>
      <stop offset="0.53" stop-color="#157db7"/>
      <stop offset="1" stop-color="#105486"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0.25" y1="0" x2="0.77" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.57" stop-color="#e5faff"/>
      <stop offset="1" stop-color="#a8deef"/>
    </linearGradient>
  </defs>

  <!-- The rounded tile stays clear of the edge so the mark reads in the Windows taskbar. -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="51.5" fill="none" stroke="#a9e8f5" stroke-opacity=".32"/>

  <!-- One folder, with a raised tab and an open upper rim. -->
  <path d="M47 125c0-9.4 7.6-17 17-17h42c4.3 0 8.4 1.7 11.4 4.8l9.4 9.2H192c9.4 0 17 7.6 17 17v49c0 11.6-9.4 21-21 21H68c-11.6 0-21-9.4-21-21z" fill="url(#folder)"/>
  <path d="M47 144h162v44c0 11.6-9.4 21-21 21H68c-11.6 0-21-9.4-21-21z" fill="url(#front)"/>
  <path d="M60 144h136" fill="none" stroke="#a2eeff" stroke-width="4" stroke-linecap="round" stroke-opacity=".75"/>

  <!-- The soft cloud sits in the mouth of the folder, the core CloudInlet symbol. -->
  <g transform="translate(35 13) scale(.8)">
    <path d="M76 150c-16.6 0-28-11.5-28-27.2 0-14.6 11.3-26.6 25.8-27.2 5.1-21.7 23.7-36.9 46.3-36.9 18.1 0 33.7 9.6 42 23.5 2.4-.4 4.8-.6 7.2-.6 22.1 0 39.7 17.3 39.7 39.2 0 16.3-12.3 29.2-28.3 29.2z" fill="url(#cloud)"/>
  </g>

  <!-- A short luminous channel reads as a bay or dock at small sizes. -->
  <path d="M92 174h72" fill="none" stroke="#a4f3ff" stroke-width="9" stroke-linecap="round"/>
</svg>
