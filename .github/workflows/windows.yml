name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Validate central version and release automation
        run: |
          .\scripts\get-release-version.ps1
          .\scripts\test-release-scripts.ps1
      - name: Build complete solution
        run: dotnet build CloudInlet.sln -c Release -v:minimal
      - name: Test transport and reconciliation
        # Hosted Server runners are not a desktop Cloud Files acceptance environment.
        run: dotnet test CloudInlet.Tests/CloudInlet.Tests.csproj -c Release --no-build --filter "TestCategory!=LiveProvider&FullyQualifiedName!~Native" -v:minimal --logger "trx;LogFileName=windows-ci.trx" --results-directory artifacts/ci-tests
      - name: Test silent EXE and MSI installation and updates
        run: .\scripts\test-installers.ps1
      - name: Retain installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudInlet-installer-acceptance
          path: |
            artifacts/validation/installer-host-*/result.json
            artifacts/validation/installer-host-*/transcript.txt
            artifacts/validation/installer-fixture-*/installer-validation.json
            artifacts/validation/installer-fixture-*/*.log
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudInlet-Windows-test-results
          path: artifacts/ci-tests/*.trx
          if-no-files-found: ignore
