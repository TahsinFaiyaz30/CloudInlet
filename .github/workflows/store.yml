name: Microsoft Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified immutable GitHub release tag (for example v1.0.0)
        type: string
        required: true
      submit:
        description: Submit to Partner Center after packaging (requires microsoft-store environment credentials)
        type: boolean
        default: false
      publishMode:
        description: Partner Center publication mode after certification
        type: choice
        options: [Manual, Immediate]
        default: Manual

permissions:
  contents: read

concurrency:
  group: cloudinlet-microsoft-store
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the released source and download its Release app
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'A stable release tag is required.' }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release could not be verified.' }
          $release = $release | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'Store packages must come from a published stable release.' }
          git fetch origin tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the released source.' }
          git checkout --detach $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the released source.' }
          $version = .\scripts\get-release-version.ps1
          $name = "CloudInlet-$($version.version)-win-x64-release-portable.zip"
          $feed = "updates-v2.json"
          $expectedRepository = $env:GITHUB_REPOSITORY
          $expectedSchema = 2
          if (!@($release.assets | Where-Object { $_.name -ceq $name }).Count) {
            # Historical immutable releases predate the rename and use their original feed.
            $name = "CloudBay-$($version.version)-win-x64-release-portable.zip"
            $feed = "updates-v1.json"
            $expectedRepository = "TahsinFaiyaz30/CloudBay"
            $expectedSchema = 1
          }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $name --pattern $feed --dir artifacts/store-download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the released app.' }
          $manifest = Get-Content (Join-Path artifacts/store-download $feed) -Raw | ConvertFrom-Json
          $asset = @($manifest.assets | Where-Object { $_.fileName -ceq $name -and $_.buildFlavor -ceq 'Release' -and $_.installerKind -ceq 'Portable' })
          $path = Join-Path artifacts/store-download $name
          if ($manifest.schemaVersion -ne $expectedSchema -or $manifest.repository -cne $expectedRepository -or $manifest.tag -cne $env:RELEASE_TAG -or $manifest.version -cne $version.version -or $asset.Count -ne 1 -or (Get-Item $path).Length -ne $asset[0].size -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $asset[0].sha256) { throw 'Released app hash or identity validation failed.' }
          Expand-Archive -LiteralPath $path -DestinationPath artifacts/store-source
          "version=$($version.version)" >> $env:GITHUB_OUTPUT
          "revision=$($version.sourceRevision)" >> $env:GITHUB_OUTPUT
      - name: Build production MSIX and MSIXUPLOAD
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          CLOUDINLET_STORE_IDENTITY_NAME: ${{ vars.CLOUDINLET_STORE_IDENTITY_NAME || vars.CLOUDBAY_STORE_IDENTITY_NAME }}
          CLOUDINLET_STORE_PUBLISHER: ${{ vars.CLOUDINLET_STORE_PUBLISHER || vars.CLOUDBAY_STORE_PUBLISHER }}
          CLOUDINLET_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.CLOUDINLET_STORE_PUBLISHER_DISPLAY_NAME || vars.CLOUDBAY_STORE_PUBLISHER_DISPLAY_NAME }}
          # Historical immutable tags still read the original variable names.
          CLOUDBAY_STORE_IDENTITY_NAME: ${{ vars.CLOUDINLET_STORE_IDENTITY_NAME || vars.CLOUDBAY_STORE_IDENTITY_NAME }}
          CLOUDBAY_STORE_PUBLISHER: ${{ vars.CLOUDINLET_STORE_PUBLISHER || vars.CLOUDBAY_STORE_PUBLISHER }}
          CLOUDBAY_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.CLOUDINLET_STORE_PUBLISHER_DISPLAY_NAME || vars.CLOUDBAY_STORE_PUBLISHER_DISPLAY_NAME }}
        run: .\scripts\build-store-package.ps1 -AppFolder artifacts/store-source -Version $env:RELEASE_VERSION -SourceRevision $env:RELEASE_REVISION -OutputDirectory artifacts/store-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CloudInlet-Microsoft-Store
          path: artifacts/store-packages/*
          if-no-files-found: error

  submit:
    needs: package
    if: inputs.submit
    runs-on: windows-2025
    environment: microsoft-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CloudInlet-Microsoft-Store
          path: artifacts/store-packages
      - name: Submit the package to Partner Center
        shell: pwsh
        env:
          CLOUDINLET_STORE_APPLICATION_ID: ${{ vars.CLOUDINLET_STORE_APPLICATION_ID || vars.CLOUDBAY_STORE_APPLICATION_ID }}
          CLOUDINLET_STORE_IDENTITY_NAME: ${{ vars.CLOUDINLET_STORE_IDENTITY_NAME || vars.CLOUDBAY_STORE_IDENTITY_NAME }}
          CLOUDINLET_STORE_PUBLISHER: ${{ vars.CLOUDINLET_STORE_PUBLISHER || vars.CLOUDBAY_STORE_PUBLISHER }}
          CLOUDINLET_STORE_TENANT_ID: ${{ secrets.CLOUDINLET_STORE_TENANT_ID || secrets.CLOUDBAY_STORE_TENANT_ID }}
          CLOUDINLET_STORE_CLIENT_ID: ${{ secrets.CLOUDINLET_STORE_CLIENT_ID || secrets.CLOUDBAY_STORE_CLIENT_ID }}
          CLOUDINLET_STORE_CLIENT_SECRET: ${{ secrets.CLOUDINLET_STORE_CLIENT_SECRET || secrets.CLOUDBAY_STORE_CLIENT_SECRET }}
          STORE_PUBLISH_MODE: ${{ inputs.publishMode }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/store-packages -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw 'Exactly one production Store package is required.' }
          .\scripts\submit-store-package.ps1 -PackagePath $packages[0].FullName -PublishMode $env:STORE_PUBLISH_MODE -CommitSubmission
